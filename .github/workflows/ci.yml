name: ci

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .[dev]
      - run: pytest -q

  deploy:
    needs: test
    # Secrets are not readable inside `if:`, so the repository VARIABLE
    # AWS_DEPLOY_ENABLED gates this job. Set it to "true" once the AWS
    # credential secrets exist (see README, "Deploy").
    if: github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'eu-central-1' }}
      - run: sam build
      - run: >
          sam deploy --no-confirm-changeset --no-fail-on-empty-changeset
          --stack-name form-assistant-proof --resolve-s3
          --capabilities CAPABILITY_IAM
